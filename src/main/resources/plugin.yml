name: SMPClasses
version: 1.3.0
main: ru.ddk.classes.SMPClassesPlugin
api-version: '1.21.11'
author: ddk
description: Шесть классов и способности для анархичного SMP
commands:
  class:
    description: Информация о классе и способности
    usage: /class
  classadmin:
    description: Администрирование классов
    usage: /classadmin set <player> <class> | reset <player>
    permission: smpclasses.admin
permissions:
  smpclasses.admin:
    description: Управление классами игроков
    default: op
