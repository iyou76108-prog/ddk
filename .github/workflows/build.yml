name: Build plugins and skin resource pack

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build SMPClasses
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Build SMPClassSkins plugin
        run: mvn --batch-mode --no-transfer-progress -f skin-plugin/pom.xml clean verify
      - name: Build resource pack
        run: |
          python3 skin-plugin/resourcepack/build_pack.py target/SMPClassSkins-ResourcePack
          cd target
          zip -qr SMPClassSkins-ResourcePack-1.0.0.zip SMPClassSkins-ResourcePack
      - name: Upload SMPClasses JAR
        uses: actions/upload-artifact@v4
        with:
          name: SMPClasses-1.3.2
          path: target/SMPClasses-1.3.2.jar
          if-no-files-found: error
      - name: Upload SMPClassSkins JAR
        uses: actions/upload-artifact@v4
        with:
          name: SMPClassSkins-1.1.0
          path: skin-plugin/target/SMPClassSkins-1.1.0.jar
          if-no-files-found: error
      - name: Upload SMPClassSkins resource pack
        uses: actions/upload-artifact@v4
        with:
          name: SMPClassSkins-ResourcePack-1.0.0
          path: target/SMPClassSkins-ResourcePack-1.0.0.zip
          if-no-files-found: error
      - name: Upload combined skins bundle
        uses: actions/upload-artifact@v4
        with:
          name: SMPClassSkins-Bundle-1.0.0
          path: |
            skin-plugin/target/SMPClassSkins-1.1.0.jar
            target/SMPClassSkins-ResourcePack-1.0.0.zip
          if-no-files-found: error
