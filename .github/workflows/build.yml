name: Build plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: SMPClasses-1.3.0
          path: target/SMPClasses-1.3.0.jar
          if-no-files-found: error
